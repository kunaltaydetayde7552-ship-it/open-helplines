name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Validate data
        run: python3 scripts/validate.py
      - name: Test validator
        run: python3 -m unittest discover tests -v
      - name: Build
        run: python3 scripts/build.py
      - name: Re-fetch sources for changed countries (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'data/countries/*.json')
          if [ -z "$files" ]; then echo "No data files changed."; exit 0; fi
          python3 scripts/check_sources.py --markdown report.md $files
          status=$?
          { echo "## Source check (advisory)"; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
